<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GESAR - Controle de Medicação</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    background: white;
}

.logo-link {
    display: block;
    width: 100%;
}

.logo-link img {
    display: block;
    width: 100%;
    height: auto;
}

.info {
    padding: 30px 20px 40px;
    text-align: center;
}

.info h1 {
    color: #b40000;
    font-size: 30px;
    margin: 0 0 15px;
}

.info p {
    color: #555;
    font-size: 19px;
    line-height: 1.5;
    margin: 0;
}

@media (max-width: 600px) {
    .info h1 {
        font-size: 26px;
    }

    .info p {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="container">

    <a
        class="logo-link"
        href="https://docs.google.com/spreadsheets/d/1kQoi5-4G1BKpcYz3dS6oJOv7FnjrXzpm/edit?usp=drivesdk&ouid=105851070055766953241&rtpof=true&sd=true"
        target="_blank"
    >
        <img
            src="gesar-controle-medicacao.jpeg"
            alt="GESAR - Controle de Medicação"
        >
    </a>

    <div class="info">
        <h1>Controle de Medicação</h1>
        <p>
            Toque na imagem acima para acessar o controle oficial
            de medicamentos da equipe GESAR.
        </p>
    </div>

</div>

</body>
</html>
