<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GESAR - Controle de Medicação</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #063b3b, #087f7a);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 480px;
    background: white;
    border-radius: 24px;
    padding: 40px 28px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.25);
}

.logo {
    width: 95px;
    height: 95px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #087f7a;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 8px 20px rgba(8,127,122,0.35);
}

h1 {
    margin: 0;
    color: #063b3b;
    font-size: 28px;
}

.subtitle {
    margin: 10px 0 30px;
    color: #666;
    font-size: 16px;
    line-height: 1.5;
}

.info {
    background: #eef8f7;
    border-radius: 15px;
    padding: 16px;
    margin-bottom: 25px;
    color: #315555;
    font-size: 14px;
}

.button {
    display: block;
    width: 100%;
    padding: 17px;
    border-radius: 14px;
    background: #087f7a;
    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    transition: 0.2s;
}

.button:hover {
    background: #065f5c;
    transform: translateY(-2px);
}

.footer {
    margin-top: 28px;
    color: #999;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        GESAR
    </div>

    <h1>Controle de Medicação</h1>

    <p class="subtitle">
        Sistema de controle e acompanhamento de medicamentos.
    </p>

    <div class="info">
        Acesse abaixo a planilha oficial para realizar
        o controle e acompanhamento das medicações.
    </div>

    <a
        class="button"
        href="https://docs.google.com/spreadsheets/d/1kQoi5-4G1BKpcYz3dS6oJOv7FnjrXzpm/edit?usp=drivesdk&ouid=105851070055766953241&rtpof=true&sd=true"
        target="_blank">
        📋 Acessar Controle de Medicação
    </a>

    <div class="footer">
        GESAR • Controle de Medicação
    </div>

</div>

</body>
</html>
