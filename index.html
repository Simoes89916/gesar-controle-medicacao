<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GESAR - Controle de Medicação</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #b00000, #e00000);
    display: flex;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.30);
}

.logo {
    width: 100%;
    display: block;
}

.content {
    padding: 25px;
    text-align: center;
}

h1 {
    color: #b00000;
    margin: 0 0 10px;
    font-size: 25px;
}

p {
    color: #555;
    line-height: 1.5;
    margin-bottom: 25px;
}

.button {
    display: block;
    width: 100%;
    padding: 18px;
    background: #c90000;
    color: white;
    text-decoration: none;
    border-radius: 15px;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(180,0,0,0.25);
}

.button:hover {
    background: #a00000;
}

.footer {
    margin-top: 20px;
    color: #999;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <img
        class="logo"
        src="gesar-controle-medicacao.jpeg"
        alt="GESAR - Controle de Medicação">

    <div class="content">

        <h1>Controle de Medicação</h1>

        <p>
            Acesse o controle oficial de medicamentos
            da equipe GESAR.
        </p>

        <a
            class="button"
            href="https://docs.google.com/spreadsheets/d/1kQoi5-4G1BKpcYz3dS6oJOv7FnjrXzpm/edit?usp=drivesdk&ouid=105851070055766953241&rtpof=true&sd=true"
            target="_blank">
            📋 ACESSAR CONTROLE DE MEDICAÇÃO
        </a>

        <div class="footer">
            GESAR • Equipe de Socorristas
        </div>

    </div>

</div>

</body>
</html>
